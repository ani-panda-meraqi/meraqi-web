<svg width="1600" height="1400" viewBox="0 0 1600 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8ea3"/>
    </marker>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f6a085"/>
    </marker>
    <style>
      text{font-family:'Hanken Grotesk','Segoe UI',Arial,sans-serif;fill:#f7f8f4;}
      .title{font-size:36px;font-weight:700;}
      .subtitle{font-size:19px;fill:#95a9bf;}
      .bnd{font-size:16px;font-weight:700;fill:#ee5a34;letter-spacing:.5px;}
      .h{font-size:21px;font-weight:700;}
      .b{font-size:18px;font-weight:600;}
      .s{font-size:15px;fill:#95a9bf;}
      .tag{font-size:13px;font-weight:700;}
      .leg{font-size:16px;}
      .flow{stroke:#7a8ea3;stroke-width:2.5;fill:none;}
      .cond{stroke:#f6a085;stroke-width:2.5;fill:none;stroke-dasharray:7 5;}
      .rail-a{stroke:#ee5a34;stroke-width:2;fill:none;stroke-dasharray:6 5;}
    </style>
  </defs>

  <!-- Title -->
  <text class="title" x="800" y="50" text-anchor="middle">Meraqi - Sovereign Execution Boundary</text>
  <text class="subtitle" x="800" y="82" text-anchor="middle">The entire multi-modal pipeline runs inside one air-gapped workstation; nothing crosses the boundary</text>

  <!-- Air-gap boundary -->
  <rect x="120" y="105" width="1360" height="1225" rx="18" fill="none" stroke="#ee5a34" stroke-width="2.5" stroke-dasharray="11 8"/>
  <text class="bnd" x="142" y="134">AIR-GAPPED &#183; ZERO NETWORK &#183; ZERO TELEMETRY &#183; PRODUCTION: 2&#215; RTX 6000 PRO + TR PRO 7975WX + 128-256&#8202;GB ECC (50-100 SESSIONS) &#183; PROVEN ON 1&#215; 24&#8202;GB GPU</text>

  <!-- INPUTS -->
  <g>
    <rect x="215" y="160" width="270" height="66" rx="10" fill="#082c4d" stroke="#7a8ea3" stroke-width="1.8"/>
    <text class="b" x="350" y="200" text-anchor="middle">Text prompt</text>
    <rect x="515" y="160" width="270" height="66" rx="10" fill="#082c4d" stroke="#7a8ea3" stroke-width="1.8"/>
    <text class="b" x="650" y="193" text-anchor="middle">URL snapshot (ad brief)</text>
    <text class="s" x="650" y="214" text-anchor="middle">captured at ingestion</text>
    <rect x="815" y="160" width="270" height="66" rx="10" fill="#082c4d" stroke="#7a8ea3" stroke-width="1.8"/>
    <text class="b" x="950" y="193" text-anchor="middle">Speech</text>
    <text class="s" x="950" y="214" text-anchor="middle">&#8594; local speech-to-text</text>
    <rect x="1115" y="160" width="270" height="66" rx="10" fill="#082c4d" stroke="#7a8ea3" stroke-width="1.8"/>
    <text class="b" x="1250" y="193" text-anchor="middle">Documents</text>
    <text class="s" x="1250" y="214" text-anchor="middle">+ brand assets &#8594; local RAG</text>
  </g>
  <!-- input manifold -->
  <path class="flow" d="M350,226 L350,248 M650,226 L650,248 M950,226 L950,248 M1250,226 L1250,248" />
  <path class="flow" d="M350,248 L1250,248" />
  <path class="flow" d="M800,248 L800,286" marker-end="url(#arw)"/>

  <!-- REDIS -->
  <rect x="360" y="288" width="880" height="58" rx="10" fill="#04223f" stroke="#7a8ea3" stroke-width="2"/>
  <text class="b" x="800" y="323" text-anchor="middle">Redis in-memory FIFO queue &#183; absorbs 50-100 concurrent sessions &#183; dispatch gated by ledger admission</text>
  <path class="flow" d="M800,346 L800,392" marker-end="url(#arw)"/>

  <!-- ANCHOR -->
  <rect x="360" y="394" width="880" height="82" rx="12" fill="rgba(238,90,52,0.10)" stroke="#ee5a34" stroke-width="3"/>
  <text class="h" x="800" y="428" text-anchor="middle" fill="#f6a085">Cross-Modal Latent Anchor &#9656; consistency layer</text>
  <text class="s" x="800" y="456" text-anchor="middle">model-independent identity / structure / spatial prior - corrects drift at every hand-off</text>
  <path class="flow" d="M800,476 L800,516" marker-end="url(#arw)"/>

  <!-- WORKER 1 -->
  <rect x="360" y="518" width="880" height="150" rx="12" fill="#04223f" stroke="#5b87ad" stroke-width="2.2"/>
  <text class="h" x="384" y="550">GPU Worker 1 - Cognitive &amp; Canvas</text>
  <rect x="384" y="566" width="400" height="86" rx="9" fill="#082c4d" stroke="#5b87ad" stroke-width="1.6"/>
  <text class="b" x="584" y="600" text-anchor="middle">Orchestrator LLM</text>
  <text class="s" x="584" y="624" text-anchor="middle">prompt refinement &#8594; structured JSON plan</text>
  <rect x="816" y="566" width="400" height="86" rx="9" fill="rgba(95,191,143,0.12)" stroke="#5fbf8f" stroke-width="1.6"/>
  <text class="b" x="1016" y="596" text-anchor="middle">Fast image model</text>
  <text class="s" x="1016" y="618" text-anchor="middle">storyboard &#183; branded assets</text>
  <text class="tag" x="1016" y="642" text-anchor="middle" fill="#5fbf8f">&#10003; prompt&#8594;image proven</text>
  <path class="flow" d="M784,609 L812,609" marker-end="url(#arw)"/>
  <path class="flow" d="M800,668 L800,708" marker-end="url(#arw)"/>

  <!-- WORKER 2 -->
  <rect x="360" y="710" width="880" height="238" rx="12" fill="#04223f" stroke="#5b87ad" stroke-width="2.2"/>
  <text class="h" x="384" y="742">GPU Worker 2 - Heavy Synthesis &amp; Lifting</text>
  <rect x="384" y="756" width="832" height="52" rx="9" fill="rgba(95,191,143,0.12)" stroke="#5fbf8f" stroke-width="1.6"/>
  <text class="b" x="404" y="789" text-anchor="start">Video-Audio DiT &#8594; 45&#8201;s streamed video + audio (anchored tail re-injection)</text>
  <text class="tag" x="1196" y="789" text-anchor="end" fill="#5fbf8f">&#10003; PROVEN</text>
  <rect x="384" y="816" width="832" height="52" rx="9" fill="rgba(217,164,65,0.12)" stroke="#d9a441" stroke-width="1.6"/>
  <text class="b" x="404" y="849" text-anchor="start">Image &#8594; 3D lifter &#8594; mesh (GLB / OBJ, PBR textures)</text>
  <text class="tag" x="1196" y="849" text-anchor="end" fill="#d9a441">&#8635; IN&#8201;DEV</text>
  <rect x="384" y="876" width="832" height="52" rx="9" fill="rgba(217,164,65,0.12)" stroke="#d9a441" stroke-width="1.6"/>
  <text class="b" x="404" y="909" text-anchor="start">3D &#8594; rigged video animation</text>
  <text class="tag" x="1196" y="909" text-anchor="end" fill="#d9a441">&#8635; IN&#8201;DEV</text>
  <path class="flow" d="M800,948 L800,988" marker-end="url(#arw)"/>

  <!-- GOVERNANCE -->
  <rect x="380" y="986" width="840" height="62" rx="10" fill="#04223f" stroke="#7a8ea3" stroke-width="2"/>
  <text class="b" x="800" y="1010" text-anchor="middle">Local governance &#183; provenance ledger: who / what / when / where / every version <tspan fill="#5fbf8f" font-weight="bold">&#10003;</tspan></text>
  <text class="s" x="800" y="1036" text-anchor="middle">prohibited-content screening &amp; grading <tspan fill="#d9a441" font-weight="bold">&#8635; IN&#8201;DEV</tspan> &#183; hard-purge &amp; incident log on fail</text>
  <path class="flow" d="M800,1048 L800,1086" marker-end="url(#arw)"/>

  <!-- OUTPUTS -->
  <path class="flow" d="M350,1108 L350,1088 L1250,1088 L1250,1108" />
  <g>
    <rect x="215" y="1108" width="270" height="66" rx="10" fill="rgba(95,191,143,0.12)" stroke="#5fbf8f" stroke-width="1.8"/>
    <text class="b" x="350" y="1140" text-anchor="middle">Video + Audio (&#8804;45&#8201;s)</text>
    <text class="tag" x="350" y="1162" text-anchor="middle" fill="#5fbf8f">&#10003; PROVEN</text>
    <rect x="515" y="1108" width="270" height="66" rx="10" fill="rgba(95,191,143,0.12)" stroke="#5fbf8f" stroke-width="1.8"/>
    <text class="b" x="650" y="1140" text-anchor="middle">Advertisement (&#8804;45&#8201;s)</text>
    <text class="tag" x="650" y="1162" text-anchor="middle" fill="#5fbf8f">&#10003; PROVEN</text>
    <rect x="815" y="1108" width="270" height="66" rx="10" fill="rgba(217,164,65,0.12)" stroke="#d9a441" stroke-width="1.8"/>
    <text class="b" x="950" y="1140" text-anchor="middle">3D mesh + animation</text>
    <text class="tag" x="950" y="1162" text-anchor="middle" fill="#d9a441">&#8635; IN&#8201;DEV</text>
    <rect x="1115" y="1108" width="270" height="66" rx="10" fill="rgba(217,164,65,0.12)" stroke="#d9a441" stroke-width="1.8"/>
    <text class="b" x="1250" y="1140" text-anchor="middle">Branded deck (.pptx)</text>
    <text class="tag" x="1250" y="1162" text-anchor="middle" fill="#d9a441">&#8635; IN&#8201;DEV</text>
  </g>

  <!-- Reservation scheduler rail -->
  <rect x="1258" y="518" width="205" height="430" rx="12" fill="rgba(238,90,52,0.08)" stroke="#ee5a34" stroke-width="2"/>
  <text class="b" x="1360" y="556" text-anchor="middle" fill="#f6a085">Reservation</text>
  <text class="b" x="1360" y="580" text-anchor="middle" fill="#f6a085">Scheduler</text>
  <text class="s" x="1360" y="622" text-anchor="middle">admits only jobs whose</text>
  <text class="s" x="1360" y="646" text-anchor="middle">full memory envelope</text>
  <text class="s" x="1360" y="670" text-anchor="middle">fits the ledger</text>
  <text class="s" x="1360" y="712" text-anchor="middle" fill="#f6a085">&#8594; OOM is an admission</text>
  <text class="s" x="1360" y="736" text-anchor="middle" fill="#f6a085">&#8594; outcome, never a crash</text>
  <path class="rail-a" d="M1258,600 L1242,600" marker-end="url(#arw)"/>
  <path class="rail-a" d="M1258,830 L1242,830" marker-end="url(#arw)"/>

  <!-- Anchor conditioning thread -->
  <path class="cond" d="M360,435 L330,435 L330,900 L358,900" marker-end="url(#arwB)"/>
  <path class="cond" d="M330,593 L358,593" marker-end="url(#arwB)"/>
  <path class="cond" d="M330,782 L358,782" marker-end="url(#arwB)"/>
  <path class="cond" d="M330,842 L358,842" marker-end="url(#arwB)"/>
  <text class="tag" x="316" y="670" text-anchor="middle" fill="#f6a085" transform="rotate(-90 316 670)">consistency conditioning</text>

  <!-- Legend -->
  <rect x="430" y="1210" width="24" height="24" rx="5" fill="rgba(95,191,143,0.12)" stroke="#5fbf8f" stroke-width="1.8"/>
  <text class="leg" x="464" y="1228">&#10003; Proven - feasibility demonstrated</text>
  <rect x="830" y="1210" width="24" height="24" rx="5" fill="rgba(217,164,65,0.12)" stroke="#d9a441" stroke-width="1.8"/>
  <text class="leg" x="864" y="1228">&#8635; In development - roadmap</text>
</svg>
